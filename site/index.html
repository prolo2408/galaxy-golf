<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#0b0d1a}*,*::before,*::after{box-sizing:inherit}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Ein-Bildschirm-Spiel: HUD oben, Spielfeld füllt die Mitte, Bedienleiste unten. Bewusst nur dunkles Weltall-Design. */
:root{
  --void:#0b0d1a; --panel:#151a2e; --line:#2a3152; --ink:#e8ecff; --dim:#8a93b8;
  --gold:#f5b942; --pull:#7d74e0; --pull2:#2fb38a; --push:#e0603a;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em;margin:0}
.brand span{color:var(--gold)}
.stats{display:flex;gap:16px;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat small{font-family:var(--body);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stat b{font-weight:500;font-size:18px}
.field{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;background:radial-gradient(circle at 30% 20%,#161b36 0,var(--void) 70%);border:1px solid var(--line);touch-action:none;max-width:100%}
.msg{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--display);font-size:15px;color:var(--dim);pointer-events:none;transition:opacity .3s}
.bar{display:flex;gap:8px}
button{font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;flex:1;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.go{background:var(--gold);color:#1d1503;border-color:var(--gold)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,13,26,.78);border-radius:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(300px,86%);display:flex;flex-direction:column;gap:14px;text-align:center}
.card h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--dim);line-height:1.5}
.stars{font-size:30px;letter-spacing:6px;color:var(--gold)}
.stars i{font-style:normal;color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding:2px;overscroll-behavior:contain}
.grid button{padding:10px 0;font-family:var(--display);display:flex;flex-direction:column;align-items:center;gap:2px}
.grid button small{font-size:10px;color:var(--gold);letter-spacing:1px}
.grid button[aria-disabled="true"]{opacity:.35}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="hud">
    <h1 class="brand">Galaxy <span>Golf</span></h1>
    <div class="stats">
      <div class="stat"><small>Bahn</small><b id="lv">1/10</b></div>
      <div class="stat"><small>Par</small><b id="par">2</b></div>
      <div class="stat"><small>Schläge</small><b id="sh">0</b></div>
    </div>
  </header>
  <main class="field" id="field">
    <canvas id="c" aria-label="Spielfeld: irgendwo hintippen, zurückziehen und loslassen, um die Kugel abzuschießen"></canvas>
    <div class="msg" id="msg">Zurückziehen und loslassen</div>
    <div class="overlay" id="ov" hidden>
      <div class="card" id="card"></div>
    </div>
  </main>
  <nav class="bar">
    <button id="menu" type="button">Bahnen</button>
    <button id="tip" type="button">Tipp</button>
    <button id="reset" type="button">Neu starten</button>
  </nav>
</div>

 {b:[153,319],h:[122,48],par:5,p:[[88.5,209.5,37,1],[314,136,15,1],[311,415,11,-1],[72,361,17,-1],[0,0,11,1,88.5,209.5,73,-0.024,0.42],[0,0,10,1,88.5,209.5,96,-0.023,0.22],[0,0,13,1,88.5,209.5,84,-0.015,2.07]]}
];
const $=id=>document.getElementById(id), c=$('c'), x=c.getContext('2d');
let S=1;
function size(){
  const f=$('field'),fw=f.clientWidth,fh=f.clientHeight,k=Math.min(fw/WW,fh/WH),d=devicePixelRatio||1;
  S=k;c.style.width=WW*k+'px';c.style.height=WH*k+'px';c.width=Math.round(WW*k*d);c.height=Math.round(WH*k*d);x.setTransform(d*k,0,0,d*k,0,0);
}
addEventListener('resize',size);

let save={un:1,best:{}};
try{const s=JSON.parse(localStorage.getItem('gg-save')||'null');if(s&&s.best)save=s;}catch(e){}
function persist(){try{localStorage.setItem('gg-save',JSON.stringify(save));}catch(e){}}

const stars=Array.from({length:70},()=>[Math.random()*WW,Math.random()*WH,Math.random()*6,Math.random()<.15?1.8:1.1]);
let li=0,lvl,ball,v,st='aim',shots=0,drag=null,frames=0,t=0,flash=null,trail=[];

let hint=null;
function planets(tt=t){return lvl.p.map(p=>p.length>4?[p[4]+Math.cos(tt*p[7]*50+p[8])*p[6],p[5]+Math.sin(tt*p[7]*50+p[8])*p[6],p[2],p[3],1]:p);}
function load(i){hint=null;li=i;lvl=L[i];shots=0;home();st='aim';$('ov').hidden=true;ui();say(i===0?'Zurückziehen und loslassen':'Bahn '+(i+1));}
function home(){ball={x:lvl.b[0],y:lvl.b[1],cd:0};v={x:0,y:0};trail=[];}
function ui(){$('lv').textContent=(li+1)+'/'+L.length;$('par').textContent=lvl.par;$('sh').textContent=shots;}
let msgT;function say(s,col){const m=$('msg');m.textContent=s;m.style.color=col||'var(--dim)';m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,2200);}

function acc(px,py,P){let ax=0,ay=0;
  for(const p of P){const dx=p[0]-px,dy=p[1]-py,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,f=0.6*p[2]*p[2]*p[3]/Math.max(d2,400);ax+=f*dx/d;ay+=f*dy/d;}
  const hx=lvl.h[0]-px,hy=lvl.h[1]-py,hd=Math.hypot(hx,hy);if(hd<40&&hd>0){ax+=0.12*hx/hd;ay+=0.12*hy/hd;}
  return[ax,ay];}
function hit(px,py,P){for(const p of P)if(Math.hypot(p[0]-px,p[1]-py)<p[2]+5)return true;return false;}
function warp(o){if(!lvl.w||o.cd>0)return false;for(const w of lvl.w)for(const [a,b] of [[[w[0],w[1]],[w[2],w[3]]],[[w[2],w[3]],[w[0],w[1]]]])if(Math.hypot(a[0]-o.x,a[1]-o.y)<11){o.x=b[0];o.y=b[1];o.cd=25;return true;}return false;}
function pos(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/S,y:(e.clientY-b.top)/S};}
function power(){if(!drag)return{x:0,y:0};let dx=drag.sx-drag.x,dy=drag.sy-drag.y,l=Math.hypot(dx,dy);if(l>150){dx*=150/l;dy*=150/l;}return{x:dx*0.048,y:dy*0.048,l:Math.min(l,150)};}

c.addEventListener('pointerdown',e=>{if(st!=='aim')return;const p=pos(e);drag={sx:p.x,sy:p.y,x:p.x,y:p.y};c.setPointerCapture(e.pointerId);e.preventDefault();});
c.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.x=p.x;drag.y=p.y;});
function release(){if(!drag)return;const pw=power();drag=null;if(pw.l<8)return;let sv={x:pw.x,y:pw.y};if(hint&&Math.hypot(pw.x-hint.vx,pw.y-hint.vy)<0.6){sv={x:hint.vx,y:hint.vy};say('Tipp-Schuss!','#2fb38a');}hint=null;v=sv;st='fly';frames=0;shots++;ui();}
c.addEventListener('pointerup',release);c.addEventListener('pointercancel',()=>drag=null);

function endShot(why){flash={x:ball.x,y:ball.y,a:1};st='aim';home();say(why,'var(--push)');}
function win(){
  st='win';ball.x=lvl.h[0];ball.y=lvl.h[1];
  const n=shots<=lvl.par-1?3:shots<=lvl.par?2:1, k=li+1;
  const prev=save.best[k];if(!prev||shots<prev.s)save.best[k]={s:shots,st:n};
  if(save.un<Math.min(L.length,k+1))save.un=Math.min(L.length,k+1);persist();
  const last=li===L.length-1, words=shots===1?'Hole in one!':n===3?'Unter Par!':n===2?'Par geschafft':'Eingelocht';
  $('card').innerHTML='<div class="stars">'+'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i></div><h2>'+words+'</h2><p>'+shots+(shots===1?' Schlag':' Schläge')+' bei Par '+lvl.par+(last?'. Das war die letzte Bahn.':'')+'</p>'+
    '<div class="bar"><button type="button" id="again">Nochmal</button><button type="button" class="go" id="nx">'+(last?'Alle Bahnen':'Weiter')+'</button></div>';
  $('again').onclick=()=>load(li);$('nx').onclick=()=>last?showMenu():load(li+1);
  setTimeout(()=>{$('ov').hidden=false;},450);
}
function step(){
  const P=planets(),a=acc(ball.x,ball.y,P);v.x+=a[0];v.y+=a[1];v.x*=0.999;v.y*=0.999;ball.x+=v.x;ball.y+=v.y;frames++;if(ball.cd>0)ball.cd--;else if(warp(ball)){trail=[];say('Wurmloch!','#4fc3f7');}
  if(frames%2===0){trail.push([ball.x,ball.y]);if(trail.length>40)trail.shift();}
  if(Math.hypot(lvl.h[0]-ball.x,lvl.h[1]-ball.y)<11)return win();
  if(hit(ball.x,ball.y,P))return endShot('Crash! Nochmal.');
  if(ball.x<-40||ball.x>WW+40||ball.y<-40||ball.y>WH+40)return endShot('Ab ins All. Nochmal.');
  if(frames>800)return endShot('Verloren im Orbit.');
}

function showMenu(){
  st=st==='fly'?'aim':st;let h='<h2>Bahnen</h2><div class="grid">';
  for(let i=1;i<=L.length;i++){const lock=i>save.un,b=save.best[i];
    h+='<button type="button" data-l="'+i+'" aria-disabled="'+lock+'">'+i+'<small>'+(b?'★'.repeat(b.st):lock?'–':'&nbsp;')+'</small></button>';}
  const tot=Object.values(save.best).reduce((a,b)=>a+b.st,0);h+='</div><p>'+tot+' von '+L.length*3+' Sternen. Unter Par drei, Par zwei, sonst einer.</p><div class="bar"><button type="button" id="close">Zurück zum Spiel</button></div>';
  $('card').innerHTML=h;$('ov').hidden=false;
  $('card').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const n=+b.dataset.l;if(n<=save.un)load(n-1);});
  $('close').onclick=()=>{$('ov').hidden=true;if(st==='win')load(li);};
}

function draw(){
  x.clearRect(0,0,WW,WH);
  for(const s of stars){x.fillStyle='rgba(200,208,255,'+(0.18+0.18*Math.sin(t*1.5+s[2]))+')';x.fillRect(s[0],s[1],s[3],s[3]);}
  const P=planets();
  for(const p of P){const pull=p[3]>0,col=pull?(p[2]>22?'#7d74e0':'#2fb38a'):'#e0603a';
    x.strokeStyle=pull?'rgba(125,116,224,.16)':'rgba(224,96,58,.2)';x.lineWidth=1;
    for(let k=1;k<=3;k++){const r=p[2]+k*14+3*Math.sin(t*2*(pull?-1:1)+k);x.beginPath();x.arc(p[0],p[1],r,0,7);x.stroke();}
    x.fillStyle=col;x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill();
    x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.arc(p[0]-p[2]*.3,p[1]-p[2]*.3,p[2]*.38,0,7);x.fill();
    x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.arc(p[0]+p[2]*.15,p[1]+p[2]*.2,p[2]*.82,0.3,2.8);x.fill();}
  for(const p of lvl.p)if(p.length>4){x.strokeStyle='rgba(200,208,255,.08)';x.setLineDash([3,6]);x.beginPath();x.arc(p[4],p[5],p[6],0,7);x.stroke();x.setLineDash([]);}
  if(lvl.w)for(const w of lvl.w)for(const [qx,qy] of [[w[0],w[1]],[w[2],w[3]]]){x.fillStyle='#05060d';x.beginPath();x.arc(qx,qy,11,0,7);x.fill();for(let k=0;k<3;k++){x.strokeStyle='rgba(79,195,247,'+(.8-k*.25)+')';x.lineWidth=2;x.setLineDash([5,5]);x.lineDashOffset=t*20*(k%2?1:-1);x.beginPath();x.arc(qx,qy,11+k*5,0,7);x.stroke();}x.setLineDash([]);x.lineDashOffset=0;}
  const hx=lvl.h[0],hy=lvl.h[1];
  x.fillStyle='#05060d';x.beginPath();x.arc(hx,hy,12,0,7);x.fill();
  x.strokeStyle='#f5b942';x.lineWidth=2;x.beginPath();x.arc(hx,hy,12,0,7);x.stroke();
  x.strokeStyle='rgba(245,185,66,.3)';x.lineWidth=1;x.beginPath();x.arc(hx,hy,19+2*Math.sin(t*3),0,7);x.stroke();
  x.fillStyle='#f5b942';x.fillRect(hx-1,hy-34,2,24);x.beginPath();x.moveTo(hx+1,hy-34);x.lineTo(hx+14,hy-29);x.lineTo(hx+1,hy-24);x.fill();
  if(st==='aim'){x.strokeStyle='rgba(232,236,255,.25)';x.beginPath();x.arc(lvl.b[0],lvl.b[1],9,0,7);x.stroke();}
  for(let i=0;i<trail.length;i++){x.fillStyle='rgba(245,185,66,'+(i/trail.length*.5)+')';x.beginPath();x.arc(trail[i][0],trail[i][1],2,0,7);x.fill();}
  if(drag){const pw=power();let px=ball.x,py=ball.y,vx=pw.x,vy=pw.y,wc=0;
    for(let i=0;i<50;i++){const a=acc(px,py,P);vx+=a[0];vy+=a[1];px+=vx;py+=vy;if(wc>0)wc--;else{const q={x:px,y:py,cd:0};if(warp(q)){px=q.x;py=q.y;wc=25;}}if(hit(px,py,P))break;
      if(i%3===0){x.fillStyle='rgba(232,236,255,'+(.7*(1-i/50))+')';x.beginPath();x.arc(px,py,2,0,7);x.fill();}}
    x.strokeStyle='rgba(232,236,255,.25)';x.lineWidth=1;x.beginPath();x.moveTo(drag.sx,drag.sy);x.lineTo(drag.x,drag.y);x.stroke();
    const f=pw.l/150;x.fillStyle='rgba(255,255,255,.08)';x.fillRect(ball.x-20,ball.y+14,40,4);
    x.fillStyle=f>.85?'#e0603a':'#f5b942';x.fillRect(ball.x-20,ball.y+14,40*f,4);}
  if(flash){x.strokeStyle='rgba(224,96,58,'+flash.a+')';x.lineWidth=2;x.beginPath();x.arc(flash.x,flash.y,24*(1.5-flash.a),0,7);x.stroke();flash.a-=.03;if(flash.a<=0)flash=null;}
  if(hint&&st==='aim'){const dx=-hint.vx/0.048,dy=-hint.vy/0.048;
    x.fillStyle='rgba(245,185,66,.55)';for(const q of hint.path)if(q){x.beginPath();x.arc(q[0],q[1],1.6,0,7);x.fill();}
    let ax,ay,close=false;
    if(drag){ax=drag.sx;ay=drag.sy;const pw=power();close=Math.hypot(pw.x-hint.vx,pw.y-hint.vy)<0.6;}
    else{ax=WW/2-dx/2;ay=WH/2-dy/2;}
    const bx=ax+dx,by=ay+dy,col=close?'#2fb38a':'#f5b942';
    x.strokeStyle=col;x.lineWidth=2;x.setLineDash([6,5]);x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();x.setLineDash([]);
    if(!drag){x.beginPath();x.arc(ax,ay,9,0,7);x.stroke();}
    x.fillStyle=col;x.beginPath();x.arc(bx,by,close?14:10,0,7);x.fill();x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();x.arc(bx,by,22,0,7);x.stroke();
    if(!drag){x.fillStyle='#f5b942';x.font='500 12px Rubik, sans-serif';x.textAlign='center';x.fillText('von ○ nach ● ziehen',WW/2,Math.max(ay,by)+28);}}
  if(st!=='win'){x.fillStyle='#ffffff';x.beginPath();x.arc(ball.x,ball.y,5,0,7);x.fill();}
}
function loop(){t+=1/60;if(st==='fly'){step();if(st==='fly')step();}draw();requestAnimationFrame(loop);}

$('reset').onclick=()=>load(li);
function sim(vx,vy,t0,path){let px=lvl.b[0],py=lvl.b[1],cd=0,tt=t0,P=null;
  for(let f=0;f<800;f++){if(f%2===0){tt+=1/60;P=planets(tt);}
    const a=acc(px,py,P);vx+=a[0];vy+=a[1];vx*=0.999;vy*=0.999;px+=vx;py+=vy;
    if(cd>0)cd--;else{const q={x:px,y:py,cd:0};if(warp(q)){px=q.x;py=q.y;cd=25;if(path)path.push(null);}}
    if(path&&f%3===0)path.push([px,py]);
    if(Math.hypot(lvl.h[0]-px,lvl.h[1]-py)<11)return f;
    if(hit(px,py,P)||px<-40||px>WW+40||py<-40||py>WH+40)return -1;}
  return -1;}
function solve(){const t0=t;let best=null;const R=Math.PI/180;
  for(let a=0;a<360;a+=2)for(let pw=0.5;pw<=7.2;pw+=0.2){const vx=Math.cos(a*R)*pw,vy=Math.sin(a*R)*pw,f=sim(vx,vy,t0);if(f<0)continue;
    let ok=0;for(const [da,dp] of [[1.5,0],[-1.5,0],[0,.12],[0,-.12]])if(sim(Math.cos((a+da)*R)*(pw+dp),Math.sin((a+da)*R)*(pw+dp),t0)>=0)ok++;
    const s=ok*1000-f;if(!best||s>best.s)best={s,vx,vy};}
  return best;}
$('tip').onclick=()=>{if(st!=='aim')return;if(hint){hint=null;say('Tipp ausgeblendet');return;}
  say('Suche einen Weg…','#f5b942');
  setTimeout(()=>{const b=solve();if(!b){say('Hier finde ich gerade keinen sicheren Schuss. Probier es mit Neu starten.');return;}
    hint={vx:b.vx,vy:b.vy,path:[]};sim(b.vx,b.vy,t,hint.path);
    say('Finger aufsetzen, zum Kreis ziehen, bei Grün loslassen','#f5b942');},40);};
$('menu').onclick=showMenu;
size();load(Math.min(save.un,L.length)-1);loop();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
